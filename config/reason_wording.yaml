# Reason wording (T4): text only. Read by qc.attribute.predict when this file exists.
# Changes reasons[].text for the listed deep PCs and adds reasons[].basis / reasons[].caveat and a
# per-image `caveat`. It never changes a probability, call, tier, set, distance, z or contribution.
# Not covered by the rules-frozen tag (config/attribution_model.json is).
#
# imaging_features: rules that mark a reason `basis: imaging`. `pattern` is a regex matched at the
# start of the feature name. Every matching rule adds its caveat (joined with "; "); the first rule
# with a `text` replaces the reason text. Features matching no rule get `basis: material`.

imaging_features:
  # T2: in the frozen model deep_pc03 and deep_pc04 correlate |r| ~ 0.6 with the InLens dark-graphite share.
  - pattern: 'deep_pc0[34]$'
    text: "InLens image {shows} dark-graphite zones (share {share:.2f}); an electrical imaging contrast, not a composition difference"
    text_unmeasured: "InLens image: dark-graphite share not measured; this pattern follows an electrical imaging contrast, not a composition difference"
    shows_at: 0.10          # dark_graphite_share >= this -> "shows", else "does not show"
    caveat: "this image pattern follows the InLens dark-graphite share (|r| about 0.6, docs/experiments/T2.md)"

  # T1: the 2-pixel texture features follow detector noise (noise sigma 5 flips 12 of 17 Batch_3 calls).
  - pattern: 'tex_.*_(lbp\d+|glcm_[a-z]+_d1)$'
    caveat: "fine texture at the detector-noise scale (0.05 µm); changes with image noise"

  # T1: adding InLens dark-graphite zones moves all 7 Batch_1 images to Batch_3 through these.
  - pattern: '(tex_inlens_|par_inlens_ratio)'
    caveat: "InLens brightness; sensitive to electrical contrast and imaging"

# T9: once the measured imaging is erased every attribution signal falls to chance.
call_caveat: "Every signal behind this call is also predicted by how the image was acquired; with 31 images the batch and the imaging session cannot be separated (docs/experiments/T9.md)."
